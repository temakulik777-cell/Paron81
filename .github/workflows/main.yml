name: Build Android C++ from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip Wolsaw.zip -d project_files
        echo "=== Проверка содержимого ==="
        ls -la project_files/Wolsaw

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build with ndk-build
      run: |
        # Заходим в папку, где лежит jni
        cd project_files/Wolsaw
        
        # Запускаем сборку для 64-битных и 32-битных ARM (для Android)
        # Так как мы в папке Wolsaw, ndk-build сам найдет jni/Android.mk
        ndk-build APP_ABI="arm64-v8a armeabi-v7a"
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Libraries
        # Забираем готовые .so файлы из папки libs
        path: project_files/Wolsaw/libs/
