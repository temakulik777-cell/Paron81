name: Build Android C++ from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip Wolsaw.zip -d project_files
        cd project_files
        echo "=== Содержимое корня ==="
        ls -la
        echo "=== Ищем Android.mk ==="
        find . -name "Android.mk"

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build with ndk-build
      run: |
        cd project_files
        # Собираем для всех популярных архитектур (arm64, arm32, x86, x86_64)
        # Если Android.mk лежит прямо в корне архива:
        ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk APP_ABI="arm64-v8a armeabi-v7a" 
        
        # ❗ ВАЖНО: Если сборка снова упадет и в логах (шаг Unzip) ты увидишь, 
        # что Android.mk лежит в папке (например, ./src/Android.mk или ./Wolsaw/jni/Android.mk),
        # то замени строку выше на:
        # ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./ПАПКА/Android.mk APP_ABI="arm64-v8a armeabi-v7a"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Libraries
        path: project_files/libs/
